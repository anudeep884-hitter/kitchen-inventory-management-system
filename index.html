<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Kitchen Inventory Management System</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-container {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 32px 28px;
    }
    .demo-chips {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .demo-chip {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      transition: var(--transition);
    }
    .demo-chip:hover {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent-2);
    }
    .pwd-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .pwd-toggle {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      padding: 4px;
    }
    .error-alert {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
  </style>
</head>
<body data-page="login">
  <div class="login-container">
    <div class="card login-card">
      <div style="text-align:center;margin-bottom:24px">
        <div class="logo" style="margin:0 auto 12px;width:52px;height:52px;font-size:22px">KI</div>
        <h2 style="font-size:22px;font-weight:800;letter-spacing:-0.4px">Kitchen Inventory</h2>
        <p class="small muted" style="margin-top:4px">Sign in to manage kitchen stock, usage, and operations</p>
      </div>

      <div id="login-error" class="error-alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input id="login-email" class="input" type="email" placeholder="admin@example.com" required autocomplete="username" />
        </div>

        <div class="form-group">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
            <label class="form-label" for="login-password" style="margin-bottom:0">Password</label>
            <a href="#" id="link-forgot-password" class="small muted" style="text-decoration:none;font-size:12px">Forgot password?</a>
          </div>
          <div class="pwd-wrapper">
            <input id="login-password" class="input" type="password" placeholder="••••••••" required autocomplete="current-password" style="padding-right:40px" />
            <button type="button" id="btn-toggle-pwd" class="pwd-toggle" title="Show/Hide Password">👁️</button>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);cursor:pointer">
            <input type="checkbox" id="login-remember" checked />
            Remember me
          </label>
        </div>

        <button type="submit" id="btn-login-submit" class="btn" style="width:100%;padding:11px">
          Sign In
        </button>
      </form>

      <div style="margin-top:24px;border-top:1px solid var(--border-subtle);padding-top:16px;text-align:center">
        <div class="small muted" style="font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Quick Demo Accounts</div>
        <div class="demo-chips">
          <div class="demo-chip" data-email="admin@example.com" data-pwd="admin123">👨‍💼 Admin</div>
          <div class="demo-chip" data-email="chef@example.com" data-pwd="chef123">👨‍🍳 Chef</div>
          <div class="demo-chip" data-email="delivery@example.com" data-pwd="delivery123">🚚 Delivery Partner</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgot-modal" class="modal hidden">
    <div class="modal-card" style="max-width:400px">
      <div class="modal-header">
        <h3 class="modal-title">Reset Password</h3>
        <button type="button" class="btn-close" id="btn-close-forgot">&times;</button>
      </div>
      <p class="small muted" style="margin-bottom:14px">Enter your registered email address to receive password reset instructions.</p>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input id="forgot-email" class="input" type="email" placeholder="you@example.com" />
      </div>
      <div id="forgot-feedback" style="display:none;margin-top:10px" class="small"></div>
      <div class="actions-row">
        <button id="btn-forgot-cancel" class="btn-ghost btn-sm">Cancel</button>
        <button id="btn-forgot-submit" class="btn btn-sm">Send Reset Link</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { apiLogin, apiForgotPassword, getCurrentUser } from './shared.js';

    // If already logged in, redirect based on role
    const curUser = getCurrentUser();
    if (curUser) {
      redirectByRole(curUser.role);
    }

    function redirectByRole(role) {
      if (role === 'chef') window.location = 'chef.html';
      else if (role === 'delivery') window.location = 'delivery.html';
      else window.location = 'dashboard.html';
    }

    // Toggle password visibility
    const pwdInput = document.getElementById('login-password');
    const pwdToggle = document.getElementById('btn-toggle-pwd');
    pwdToggle.addEventListener('click', () => {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        pwdToggle.textContent = '🙈';
      } else {
        pwdInput.type = 'password';
        pwdToggle.textContent = '👁️';
      }
    });

    // Quick demo chip selection
    document.querySelectorAll('.demo-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.getElementById('login-email').value = chip.dataset.email;
        document.getElementById('login-password').value = chip.dataset.pwd;
        document.getElementById('login-form').dispatchEvent(new Event('submit'));
      });
    });

    // Submit login form
    const loginForm = document.getElementById('login-form');
    const errorAlert = document.getElementById('login-error');
    const submitBtn = document.getElementById('btn-login-submit');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const remember = document.getElementById('login-remember').checked;

      if (!email || !password) {
        showError('Please enter both email and password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Signing in...';

      try {
        const res = await apiLogin(email, password, remember);
        if (res.success && res.user) {
          redirectByRole(res.user.role);
        } else {
          showError(res.message || 'Login failed. Please check your credentials.');
        }
      } catch (err) {
        showError(err.message || 'Unable to connect to server. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In';
      }
    });

    function showError(msg) {
      errorAlert.textContent = msg;
      errorAlert.style.display = 'block';
    }

    // Forgot password modal
    const forgotModal = document.getElementById('forgot-modal');
    const linkForgot = document.getElementById('link-forgot-password');
    const btnCloseForgot = document.getElementById('btn-close-forgot');
    const btnCancelForgot = document.getElementById('btn-forgot-cancel');
    const btnSubmitForgot = document.getElementById('btn-forgot-submit');
    const forgotFeedback = document.getElementById('forgot-feedback');

    linkForgot.addEventListener('click', (e) => {
      e.preventDefault();
      forgotModal.classList.remove('hidden');
      document.getElementById('forgot-email').value = document.getElementById('login-email').value;
      forgotFeedback.style.display = 'none';
    });

    [btnCloseForgot, btnCancelForgot].forEach(btn => {
      btn.addEventListener('click', () => forgotModal.classList.add('hidden'));
    });

    btnSubmitForgot.addEventListener('click', async () => {
      const email = document.getElementById('forgot-email').value.trim();
      if (!email) {
        forgotFeedback.style.display = 'block';
        forgotFeedback.style.color = '#dc2626';
        forgotFeedback.textContent = 'Please enter your email.';
        return;
      }
      btnSubmitForgot.disabled = true;
      btnSubmitForgot.textContent = 'Sending...';
      try {
        const res = await apiForgotPassword(email);
        forgotFeedback.style.display = 'block';
        forgotFeedback.style.color = '#059669';
        forgotFeedback.textContent = res.message;
      } catch (err) {
        forgotFeedback.style.display = 'block';
        forgotFeedback.style.color = '#dc2626';
        forgotFeedback.textContent = err.message || 'Failed to send reset link.';
      } finally {
        btnSubmitForgot.disabled = false;
        btnSubmitForgot.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
