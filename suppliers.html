<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Suppliers — Kitchen Inventory</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="suppliers">
  <header class="header"></header>

  <div class="container grid">
    <aside></aside>

    <main>
      <div class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title">Supplier Management</h2>
            <div class="card-subtitle">Manage food vendors, wholesale suppliers, contacts, and inbound goods</div>
          </div>
          <button id="btn-add-supplier" class="btn">➕ Add New Supplier</button>
        </div>

        <!-- Supplier Search -->
        <div class="filter-bar">
          <div class="search-bar" style="width:100%;max-width:360px">
            <span class="search-icon">🔍</span>
            <input id="sup-search" class="input" placeholder="Search suppliers, contacts..." />
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Supplier Company</th>
                <th>Contact Person</th>
                <th>Phone &amp; Email</th>
                <th>Products Supplied</th>
                <th>Last Purchase</th>
                <th style="text-align:right">Actions</th>
              </tr>
            </thead>
            <tbody id="suppliers-table-body">
              <tr><td colspan="6" class="small muted text-center" style="padding:24px">Loading suppliers...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Supplier Modal -->
  <div id="supplier-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="sup-modal-title">New Supplier</h3>
        <button class="btn-close" id="btn-close-sup-modal">&times;</button>
      </div>
      <form id="supplier-form">
        <input type="hidden" id="form-sup-id" />

        <div class="form-group">
          <label class="form-label" for="form-sup-name">Supplier / Vendor Name *</label>
          <input id="form-sup-name" class="input" required placeholder="e.g. Fresh Valley Farms" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="form-sup-contact">Contact Person</label>
            <input id="form-sup-contact" class="input" placeholder="e.g. Rajesh Sharma" />
          </div>
          <div class="form-group">
            <label class="form-label" for="form-sup-phone">Phone Number</label>
            <input id="form-sup-phone" class="input" placeholder="+91 98000 00000" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="form-sup-email">Email Address</label>
          <input id="form-sup-email" class="input" type="email" placeholder="orders@vendor.com" />
        </div>

        <div class="form-group">
          <label class="form-label" for="form-sup-address">Address / Hub</label>
          <input id="form-sup-address" class="input" placeholder="Plot 42, Green Agri Zone" />
        </div>

        <div class="form-group">
          <label class="form-label" for="form-sup-products">Products Supplied</label>
          <input id="form-sup-products" class="input" placeholder="e.g. Organic Vegetables, Dairy, Fresh Meat" />
        </div>

        <div class="actions-row">
          <button type="button" class="btn-ghost btn-sm" id="btn-cancel-sup-modal">Cancel</button>
          <button type="submit" class="btn btn-sm">Save Supplier</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import {
      requireAuth,
      renderAppShell,
      apiGetSuppliers,
      apiAddSupplier,
      apiUpdateSupplier,
      apiDeleteSupplier,
      formatDate,
      showToast
    } from './shared.js';

    const user = requireAuth(['admin', 'delivery']);
    if (!user) { /* redirected */ }

    renderAppShell('suppliers');

    let allSuppliers = [];

    async function loadSuppliers() {
      try {
        const res = await apiGetSuppliers();
        if (res.success) {
          allSuppliers = res.suppliers || [];
          renderSuppliers();
        }
      } catch (err) {
        showToast('Error loading suppliers: ' + err.message, 'error');
      }
    }

    function renderSuppliers() {
      const q = (document.getElementById('sup-search')?.value || '').trim().toLowerCase();
      const filtered = allSuppliers.filter(s => {
        if (q && !(s.name || '').toLowerCase().includes(q) && !(s.contactPerson || '').toLowerCase().includes(q) && !(s.productsSupplied || '').toLowerCase().includes(q)) return false;
        return true;
      });

      const tbody = document.getElementById('suppliers-table-body');
      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="small muted text-center" style="padding:24px">No suppliers found.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(sup => `
        <tr>
          <td>
            <div style="font-weight:700;color:var(--text-main)">${sup.name}</div>
            <div class="small muted">${sup.address || 'Local Hub'}</div>
          </td>
          <td>${sup.contactPerson || '—'}</td>
          <td>
            <div style="font-weight:500">${sup.phone || '—'}</div>
            <div class="small muted">${sup.email || ''}</div>
          </td>
          <td class="small">${sup.productsSupplied || 'General Pantry Goods'}</td>
          <td class="small">${formatDate(sup.lastPurchaseDate)}</td>
          <td style="text-align:right">
            ${user.role === 'admin' ? `
              <div class="btn-group" style="justify-content:flex-end">
                <button class="btn-ghost btn-sm btn-edit-sup" data-id="${sup.id}">✏️ Edit</button>
                <button class="btn-ghost btn-sm btn-del-sup" data-id="${sup.id}" style="color:#ef4444">🗑️</button>
              </div>
            ` : '<span class="small muted">View Only</span>'}
          </td>
        </tr>
      `).join('');

      if (user.role === 'admin') {
        document.querySelectorAll('.btn-edit-sup').forEach(btn => {
          btn.addEventListener('click', () => {
            const sup = allSuppliers.find(s => s.id === btn.dataset.id);
            if (sup) openModal(sup);
          });
        });

        document.querySelectorAll('.btn-del-sup').forEach(btn => {
          btn.addEventListener('click', async () => {
            const sup = allSuppliers.find(s => s.id === btn.dataset.id);
            if (!sup) return;
            if (confirm(`Delete supplier "${sup.name}"?`)) {
              try {
                const res = await apiDeleteSupplier(sup.id);
                if (res.success) {
                  showToast('Supplier deleted', 'success');
                  loadSuppliers();
                }
              } catch (err) {
                showToast(err.message || 'Failed to delete', 'error');
              }
            }
          });
        });
      }
    }

    // Modal
    const modal = document.getElementById('supplier-modal');
    function openModal(sup) {
      document.getElementById('supplier-form').reset();
      if (sup) {
        document.getElementById('sup-modal-title').textContent = `Edit Supplier: ${sup.name}`;
        document.getElementById('form-sup-id').value = sup.id;
        document.getElementById('form-sup-name').value = sup.name;
        document.getElementById('form-sup-contact').value = sup.contactPerson || '';
        document.getElementById('form-sup-phone').value = sup.phone || '';
        document.getElementById('form-sup-email').value = sup.email || '';
        document.getElementById('form-sup-address').value = sup.address || '';
        document.getElementById('form-sup-products').value = sup.productsSupplied || '';
      } else {
        document.getElementById('sup-modal-title').textContent = '➕ Add New Supplier';
        document.getElementById('form-sup-id').value = '';
      }
      modal.classList.remove('hidden');
    }

    document.getElementById('btn-add-supplier').addEventListener('click', () => openModal(null));

    [document.getElementById('btn-close-sup-modal'), document.getElementById('btn-cancel-sup-modal')].forEach(btn => {
      btn.addEventListener('click', () => modal.classList.add('hidden'));
    });

    document.getElementById('supplier-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('form-sup-id').value;
      const data = {
        name: document.getElementById('form-sup-name').value.trim(),
        contactPerson: document.getElementById('form-sup-contact').value.trim(),
        phone: document.getElementById('form-sup-phone').value.trim(),
        email: document.getElementById('form-sup-email').value.trim(),
        address: document.getElementById('form-sup-address').value.trim(),
        productsSupplied: document.getElementById('form-sup-products').value.trim()
      };

      try {
        if (id) {
          const res = await apiUpdateSupplier(id, data);
          if (res.success) {
            showToast('Supplier updated', 'success');
            modal.classList.add('hidden');
            loadSuppliers();
          }
        } else {
          const res = await apiAddSupplier(data);
          if (res.success) {
            showToast('Supplier created', 'success');
            modal.classList.add('hidden');
            loadSuppliers();
          }
        }
      } catch (err) {
        showToast(err.message || 'Error saving supplier', 'error');
      }
    });

    document.getElementById('sup-search')?.addEventListener('input', renderSuppliers);

    loadSuppliers();
  </script>
</body>
</html>
